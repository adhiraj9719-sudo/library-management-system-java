<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Transactions')}"></head>
<body>
<header th:replace="~{fragments :: nav('transactions')}"></header>
<main>
  <div th:replace="~{fragments :: flash}"></div>
  <div class="page-head"><h1>Transactions</h1></div>
  <section class="panel">
    <h2>Record a loan or return</h2>
    <form method="post" th:action="@{/librarian/transactions}">
      <div class="row">
        <div><label for="bookId">Book</label>
          <select id="bookId" name="bookId" required>
            <option value="">Choose a book</option>
            <option th:each="b : ${books}" th:value="${b.book.id}"
                    th:text="'#' + ${b.book.id} + ' ' + ${b.book.title} + ' (' + ${b.available} + ' available)'"></option>
          </select></div>
        <div><label for="memberId">Member</label>
          <select id="memberId" name="memberId" required>
            <option value="">Choose a member</option>
            <option th:each="m : ${members}" th:value="${m.id}" th:text="${m.name} + ' (' + ${m.membershipId} + ')'"></option>
          </select></div>
        <div><label for="date">Date</label>
          <input id="date" name="date" type="date" th:value="${today}"></div>
      </div>
      <div class="row" style="margin-top:1rem">
        <div class="shrink"><button class="btn" name="action" value="borrow" type="submit">Record borrow</button></div>
        <div class="shrink"><button class="btn ghost" name="action" value="return" type="submit">Record return</button></div>
      </div>
    </form>
  </section>
  <section class="panel">
    <div class="page-head" style="margin-bottom:.5rem">
      <h2 style="margin:0">History</h2>
      <nav aria-label="Filter">
        <a class="btn small" th:classappend="${status != 'all'} ? 'ghost'" th:href="@{/librarian/transactions(status='all')}">All</a>
        <a class="btn small" th:classappend="${status != 'active'} ? 'ghost'" th:href="@{/librarian/transactions(status='active')}">On loan</a>
        <a class="btn small" th:classappend="${status != 'overdue'} ? 'ghost'" th:href="@{/librarian/transactions(status='overdue')}">Overdue</a>
        <a class="btn small" th:classappend="${status != 'returned'} ? 'ghost'" th:href="@{/librarian/transactions(status='returned')}">Returned</a>
      </nav>
    </div>
    <div class="table-wrap" th:if="${!rows.isEmpty()}">
      <table>
        <thead><tr><th>#</th><th>Book</th><th>Member</th><th>Borrowed</th><th>Status</th><th></th></tr></thead>
        <tbody>
          <tr th:each="t : ${rows}">
            <td th:text="${t.id}">1</td>
            <td th:text="${t.book.title}">Title</td>
            <td><span th:text="${t.member.name}">Member</span><br><span class="hint" th:text="${t.member.membershipId}"></span></td>
            <td th:text="${t.borrowDate}">2026-01-01</td>
            <td><th:block th:replace="~{fragments :: loanStatus(${t})}"></th:block></td>
            <td class="actions">
              <form class="inline" method="post" th:if="${!t.returned}" th:action="@{/librarian/transactions/{id}/return(id=${t.id})}">
                <button class="btn ghost small" type="submit">Mark returned</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <p class="empty" th:if="${rows.isEmpty()}">No transactions in this view.</p>
  </section>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
