<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Error')}"></head>
<body>
<header th:replace="~{fragments :: nav('')}"></header>
<main>
  <div class="panel narrow">
    <h1 th:text="${status == 404} ? 'Page not found' : (${status == 403} ? 'Access denied' : 'Something went wrong')">Something went wrong</h1>
    <p th:if="${status == 404}">The page you asked for does not exist.</p>
    <p th:if="${status == 403}">Your account does not have access to this page.</p>
    <a class="btn" th:href="@{/}">Back to your dashboard</a>
  </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
