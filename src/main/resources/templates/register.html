<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Create account')}"></head>
<body>
<header th:replace="~{fragments :: nav('')}"></header>
<main>
  <div class="panel narrow">
    <h1>Create a member account</h1>
    <div th:replace="~{fragments :: flash}"></div>
    <form method="post" th:action="@{/register}">
      <div class="field"><label for="name">Full name</label>
        <input id="name" name="name" type="text" required autofocus th:value="${name}"></div>
      <div class="field"><label for="email">Email</label>
        <input id="email" name="email" type="email" required th:value="${email}"></div>
      <div class="field"><label for="password">Password</label>
        <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password">
        <p class="hint">At least 8 characters.</p></div>
      <button class="btn" type="submit">Create account</button>
    </form>
    <p>Already a member? <a th:href="@{/login}">Sign in</a>.</p>
  </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
