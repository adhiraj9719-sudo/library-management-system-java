<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Sign in')}"></head>
<body>
<header th:replace="~{fragments :: nav('')}"></header>
<main>
  <div class="panel narrow">
    <h1>Sign in</h1>
    <div class="flash error" role="alert" th:if="${param.error}">Email or password is incorrect.</div>
    <div class="flash success" role="status" th:if="${param.logout}">You have been signed out.</div>
    <div class="flash success" role="status" th:if="${param.registered}">Account created. Sign in to start borrowing.</div>
    <div class="flash success" role="status" th:if="${param.emailChanged}">Email updated. Sign in again with the new address.</div>
    <form method="post" th:action="@{/login}">
      <div class="field"><label for="email">Email</label>
        <input id="email" name="email" type="email" required autofocus autocomplete="username"></div>
      <div class="field"><label for="password">Password</label>
        <input id="password" name="password" type="password" required autocomplete="current-password"></div>
      <button class="btn" type="submit">Sign in</button>
    </form>
    <p>New to the library? <a th:href="@{/register}">Create a member account</a>.</p>
  </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
