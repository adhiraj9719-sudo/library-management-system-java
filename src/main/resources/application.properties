spring.application.name=stacks-library

# Database: H2 stored in ./data/library.mv.db
spring.datasource.url=jdbc:h2:file:./data/library
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false
server.error.include-message=never

# Library rules (override with env vars, e.g. LIBRARY_LOAN_DAYS=21)
library.loan-days=14
library.max-active-loans=5

# Default librarian account, created on first start if none exists.
# CHANGE THE PASSWORD before deploying.
library.admin.name=Head Librarian
library.admin.email=admin@library.local
library.admin.password=admin12345

# Adds sample books and a demo member on first start. Set to false in production.
library.seed-demo=true
